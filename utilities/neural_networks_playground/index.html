<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Networks Playground — Permutation Learning</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script data-goatcounter="https://richardsrn-nnplayground.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>

<div class="app-container">

    <!-- ── Sidebar Controls ── -->
    <aside class="sidebar">

        <div class="sidebar-header">
            <h1>Neural Network<br>Playground</h1>
            <p class="subtitle">How do NNs learn to permute?</p>
        </div>

        <!-- Architecture -->
        <div class="control-group">
            <label class="group-label">Architecture</label>
            <div class="btn-group">
                <button id="arch-linear" class="btn-arch active">Linear (3→3)</button>
                <button id="arch-mlp" class="btn-arch">MLP (3→H→3)</button>
            </div>
        </div>

        <!-- Hidden Size (MLP only) -->
        <div class="control-group" id="group-hidden">
            <label class="group-label">
                Hidden Neurons: <span id="hidden-value">8</span>
            </label>
            <input type="range" id="hidden-slider" min="2" max="32" value="8" step="1">
        </div>

        <!-- Learning Rate -->
        <div class="control-group">
            <label class="group-label">
                Learning Rate: <span id="lr-value">0.0100</span>
            </label>
            <input type="range" id="lr-slider" min="0" max="100" value="50" step="1">
        </div>

        <!-- Optimizer -->
        <div class="control-group">
            <label class="group-label">Optimizer</label>
            <select id="optimizer-select">
                <option value="adam" selected>Adam</option>
                <option value="sgd">SGD</option>
            </select>
        </div>

        <!-- Regularization -->
        <div class="control-group">
            <label class="group-label">Regularization</label>
            <div class="radio-group">
                <label><input type="radio" name="reg" value="none" checked> None</label>
                <label><input type="radio" name="reg" value="l1"> L1</label>
                <label><input type="radio" name="reg" value="l2"> L2</label>
            </div>
            <div id="group-lambda" style="display:none;">
                <label class="group-label sub-label">
                    Lambda: <span id="lambda-value">0.0010</span>
                </label>
                <input type="range" id="lambda-slider" min="0" max="100" value="37" step="1">
            </div>
        </div>

        <!-- Batch Size -->
        <div class="control-group">
            <label class="group-label">
                Batch Size: <span id="batch-value">128</span>
            </label>
            <input type="range" id="batch-slider" min="8" max="512" value="128" step="8">
        </div>

        <!-- Speed -->
        <div class="control-group">
            <label class="group-label">
                Speed: <span id="speed-value">20</span> steps/s
            </label>
            <input type="range" id="speed-slider" min="1" max="60" value="20" step="1">
        </div>

        <!-- Action Buttons -->
        <div class="control-group actions">
            <div class="btn-row">
                <button id="btn-play" class="btn btn-primary" title="Start / Resume training">▶ Play</button>
                <button id="btn-pause" class="btn" title="Pause training">⏸ Pause</button>
            </div>
            <div class="btn-row">
                <button id="btn-step" class="btn" title="Run a single training step">⏭ Step</button>
                <button id="btn-reset" class="btn btn-danger" title="Reset model and clear all data">↺ Reset</button>
            </div>
        </div>

        <!-- Status Display -->
        <div class="status-display">
            <div class="status-item">
                <span class="status-label">Step</span>
                <span class="status-value mono" id="step-display">0</span>
            </div>
            <div class="status-item">
                <span class="status-label">Loss (MSE)</span>
                <span class="status-value mono" id="loss-display">—</span>
            </div>
        </div>

    </aside>

    <!-- ── Main Visualization Area ── -->
    <main class="viz-area">

        <!-- Heatmap Panel -->
        <section class="viz-panel" id="heatmap-panel">
            <div class="panel-header">
                <h2>Weight Heatmap</h2>
                <label class="toggle-label">
                    <input type="checkbox" id="ref-toggle" checked>
                    <span>Reference</span>
                </label>
                <span class="layer-label" id="heatmap-layer-label"></span>
            </div>
            <div class="svg-container" id="heatmap-container">
                <svg id="heatmap-svg"></svg>
            </div>
        </section>

        <!-- Node-Link Panel -->
        <section class="viz-panel" id="nodelink-panel">
            <div class="panel-header">
                <h2>Node-Link Diagram</h2>
            </div>
            <div class="svg-container" id="nodelink-container">
                <svg id="nodelink-svg"></svg>
            </div>
        </section>

        <!-- Loss Curve Panel -->
        <section class="viz-panel" id="loss-panel">
            <div class="panel-header">
                <h2>Loss Curve</h2>
            </div>
            <div class="svg-container" id="loss-container">
                <svg id="loss-svg"></svg>
            </div>
        </section>

    </main>

</div>

<!-- CDN Dependencies -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js"></script>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="script.js"></script>

</body>
</html>
